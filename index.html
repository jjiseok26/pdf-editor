<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 편집기</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<script defer src="assets/vendor/fontkit.umd.min.js"></script>
<script defer src="assets/vendor/pdf.min.js"></script>
<script defer src="assets/vendor/pdf-lib.min.js"></script>
<script type="module" src="js/io.js"></script>
</head>
<body>

<header id="topbar">
  <div class="brand">PDF 편집기</div>
  <div class="group">
    <button id="btnOpen" class="btn">열기</button>
    <button id="btnNew" class="btn">새 문서</button>
    <button id="btnMerge" class="btn">병합 추가</button>
    <input type="file" id="filePdf" accept="application/pdf,.pdf" class="file-hidden">
    <input type="file" id="fileMerge" accept="application/pdf,.pdf" multiple class="file-hidden">
    <input type="file" id="fileImg" accept="image/*" class="file-hidden">
  </div>
  <div class="sep"></div>
  <div class="group" id="tools">
    <button class="tbtn active" data-tool="select" title="선택/이동 (V)">선택</button>
    <button class="tbtn" data-tool="text" title="텍스트 상자 추가 (T)">텍스트</button>
    <button class="tbtn" id="btnImg" title="이미지 삽입">이미지</button>
    <button class="tbtn" data-tool="rect" title="사각형 (R)">사각형</button>
    <button class="tbtn" data-tool="ellipse" title="원 (O)">원</button>
    <button class="tbtn" data-tool="line" title="직선 (L)">선</button>
    <button class="tbtn" data-tool="pen" title="펜 (P)">펜</button>
    <button class="tbtn" data-tool="hl" title="형광펜 (H)">형광펜</button>
    <button class="tbtn" id="btnSig" title="서명 삽입">서명</button>
    <button class="tbtn" data-tool="eraser" title="요소 지우기 (E)">지우개</button>
  </div>
  <div class="sep"></div>
  <label class="chk" title="PDF 내부 텍스트를 인식하여 수정/삭제"><input type="checkbox" id="chkTextMode"> 텍스트 편집</label>
  <div class="group props">
    <input type="color" id="propColor" value="#2563eb" title="색상">
    <label class="mini">굵기 <input type="range" id="propStroke" min="1" max="24" value="2"></label>
    <label class="mini">글자 <input type="number" id="propFontSize" min="6" max="96" value="16"></label>
    <input type="color" id="propHl" value="#ffe94a" title="형광펜 색">
    <label class="chk mini" title="도형 채우기"><input type="checkbox" id="chkFill"> 채움</label>
  </div>
  <div class="spacer"></div>
  <div class="group">
    <button id="btnUndo" class="btn icon" title="되실행 (Ctrl+Z)">↩</button>
    <button id="btnRedo" class="btn icon" title="다시실행 (Ctrl+Y)">↪</button>
    <button id="btnPng" class="btn primary" title="현재 페이지를 PNG로 저장">PNG 저장</button>
    <button id="btnPngAll" class="btn" title="모든 페이지를 PNG로 저장">전체 PNG</button>
    <button id="btnSavePdf" class="btn primary strong">PDF 저장</button>
  </div>
</header>

<div id="workspace" hidden>
  <aside id="sidebar">
    <button id="btnAddPage" class="btn wide">+ 빈 페이지 추가</button>
    <div id="thumbs"></div>
    <div class="hint">드래그하면 페이지 순서가 바뀝니다.<br>✕ 로 페이지를 삭제합니다.</div>
  </aside>
  <main id="viewerArea">
    <div id="viewerScroll">
      <div id="pageWrap">
        <canvas id="pageCanvas"></canvas>
        <div id="textLayer" spellcheck="false"></div>
        <div id="annoLayer"></div>
      </div>
      <div id="noTextChip" hidden>이 페이지에는 편집 가능한 텍스트 레이어가 없습니다 (스캔 문서)</div>
    </div>
    <div id="navbar">
      <button id="btnPrev" class="btn icon">◀</button>
      <input type="number" id="pageNum" min="1" value="1">
      <span id="pageCount">/ 0</span>
      <button id="btnNext" class="btn icon">▶</button>
      <div class="sep"></div>
      <button id="btnZoomOut" class="btn icon">－</button>
      <span id="zoomLabel">130%</span>
      <button id="btnZoomIn" class="btn icon">＋</button>
      <button id="btnFit" class="btn">폭 맞춤</button>
    </div>
  </main>
</div>

<div id="emptyState">
  <h1>PDF 편집기</h1>
  <p>PDF 파일을 이곳으로 끌어다 놓거나 아래 버튼으로 시작하세요.</p>
  <div class="row">
    <button id="btnOpen2" class="btn big primary">PDF 열기</button>
    <button id="btnNew2" class="btn big">새 문서 만들기</button>
  </div>
  <p class="sub">텍스트 인식·수정 · 이미지 내보내기 · 서명 · 형광펜 · 페이지 삭제/순서 변경 · 문서 병합 · 자유 그리기</p>
</div>

<div id="sigModal" class="modal" hidden>
  <div class="sheet">
    <h3>서명</h3>
    <canvas id="sigPad"></canvas>
    <p class="sub">마우스나 터치로 서명하세요.</p>
    <div class="row spread">
      <button id="sigClear" class="btn">지우기</button>
      <div class="spacer"></div>
      <button id="sigCancel" class="btn">취소</button>
      <button id="sigOk" class="btn primary strong">문서에 삽입</button>
    </div>
  </div>
</div>

<div id="toast" hidden></div>

</body>
</html>
